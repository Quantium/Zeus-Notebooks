  # ══════════════════════════════════════════════
  # TIME OFF (PERMISOS)
  # ══════════════════════════════════════════════
  /TimeOff/AddType:
    post:
      tags: [TimeOff]
      summary: Crear tipo de permiso
      description: |
        Crea un nuevo tipo de permiso. No hay límite para crear tipos con las mismas características.
        Solo usar IsByHours cuando IsParcial=true. Solo usar LengthInHours cuando IsByHours=false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Description, IsPayable]
              properties:
                Description:
                  type: string
                  maxLength: 30
                  description: Descripción del tipo de permiso
                IsPayable:
                  type: boolean
                  description: Indica si es remunerado
                IsParcial:
                  type: boolean
                  description: Indica si es parcial
                IsByHours:
                  type: boolean
                  description: true=fijo por hora, false=cantidad de horas (solo si IsParcial=true)
                LengthInHours:
                  type: string
                  description: Número de horas en formato HH:mm (solo si IsByHours=false)
                TypeOfPartialTimeOff:
                  type: string
                  description: Usar "HalfDay" para permiso de media jornada
      responses:
        '200':
          description: Éxito - Retorna el ID encriptado del tipo de permiso creado
          content:
            application/json:
              schema:
                type: string
                description: ID encriptado del tipo de permiso
                example: X4g_hFTy9JMAQW123zVpkQ
        '400':
          description: Error en el request
        '500':
          description: Error no controlado, contactar a GV

  /TimeOff/Upsert:
    post:
      tags: [TimeOff]
      summary: Asignar permiso a usuario
      description: |
        Asigna un permiso a un usuario en una fecha específica. El campo TypeOffAssigment
        es solo para permisos parciales de media jornada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [UserIdentifier, TimeOffTypeId, StartDate, EndDate]
              properties:
                UserIdentifier:
                  type: string
                  maxLength: 16
                  description: Identificador único del usuario
                TimeOffTypeId:
                  type: string
                  maxLength: 30
                  description: Identificador encriptado del tipo de permiso
                StartDate:
                  type: string
                  maxLength: 14
                  description: Fecha y hora de inicio en formato yyyyMMddHHmmss
                EndDate:
                  type: string
                  maxLength: 14
                  description: Fecha y hora de fin en formato yyyyMMddHHmmss
                StartTime:
                  type: string
                  maxLength: 5
                  description: Hora de inicio del permiso parcial fijo por horas (HH:mm)
                EndTime:
                  type: string
                  maxLength: 5
                  description: Hora de fin del permiso parcial fijo por horas (HH:mm)
                Hours:
                  type: string
                  maxLength: 5
                  description: Cantidad de horas del permiso parcial (HH:mm)
                Description:
                  type: string
                  maxLength: 300
                  description: Descripción del permiso asignado
                TypeOffAssigment:
                  type: string
                  maxLength: 300
                  description: Para media jornada. Valores posibles:"start" o "end"
                  enum: [start, end]
      responses:
        '200':
          description: Éxito
          content:
            application/json:
              schema:
                type: boolean
                description: true si la asignación fue exitosa
        '400':
          description: Error en el request
        '500':
          description: Error no controlado, contactar a GV

  /TimeOff/Delete:
    post:
      tags: [TimeOff]
      summary: Eliminar permiso asignado a usuario
      description: Elimina la asignación de un permiso dada su fecha de inicio y fin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [TypeIdentifier, Start, End, UserIdentifier]
              properties:
                TypeIdentifier:
                  type: string
                  maxLength: 14
                  description: Identificador encriptado del permiso (TimeOffTypeId de TimeOff/Get)
                Start:
                  type: string
                  maxLength: 14
                  description: Fecha y hora de inicio en formato yyyyMMddHHmmss
                End:
                  type: string
                  maxLength: 14
                  description: Fecha y hora de fin en formato yyyyMMddHHmmss
                UserIdentifier:
                  type: string
                  maxLength: 20
                  description: Identificador del usuario
      responses:
        '200':
          description: Éxito
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Error en el request
        '500':
          description: Error no controlado, contactar a GV

  /TimeOff/Get:
    post:
      tags: [TimeOff]
      summary: Obtener permisos asignados en un periodo
      description: Retorna una lista de permisos asignados a usuarios para un periodo específico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object